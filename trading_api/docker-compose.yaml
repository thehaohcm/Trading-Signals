version: '3.8'

services:
  trading_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /home/thehaohcm/osint_ai_worker/static/podcasts:/app/static/podcasts
    environment:
      - STATIC_PODCASTS_DIR=/app/static/podcasts
    env_file:
      - .env
    networks:
      osint_net:
        aliases:
          - api
          - trading_api

networks:
  osint_net:
    external: true
    name: osint_ai_worker_default
