services:
  db:
    image: postgres:15-alpine
    container_name: osint_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: osint_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./session:/app/session
      - ./static/podcasts:/app/static/podcasts
    stdin_open: true
    tty: true

  notebooklm_worker:
    build: .
    container_name: notebooklm_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "notebooklm_worker.py"]
    env_file:
      - .env
    environment:
      NOTEBOOKLM_STORAGE: /app/notebooklm/storage_state.json
      NOTEBOOKLM_PROFILE: default
    volumes:
      - ./static/podcasts:/app/static/podcasts
      - ./notebooklm:/app/notebooklm

  api:
    build:
      context: ./trading_api
      dockerfile: Dockerfile
    container_name: osint_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TG_CHANNELS=${TG_CHANNELS}
      - STATIC_PODCASTS_DIR=/app/static/podcasts
    volumes:
      - ./static/podcasts:/app/static/podcasts
    env_file:
      - ./trading_api/.env

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: osint_ntfy
    restart: always
    command: serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8088}
      - NTFY_BEHIND_PROXY=${NTFY_BEHIND_PROXY:-false}
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    ports:
      - "${NTFY_PORT:-8088}:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy

volumes:
  postgres_data:
  ntfy_cache:
  ntfy_etc:
