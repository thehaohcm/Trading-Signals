services:
  db:
    image: postgres:15-alpine
    container_name: osint_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: osint_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./session:/app/session
      - ./static/podcasts:/app/static/podcasts
    stdin_open: true
    tty: true

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: osint_ntfy
    restart: always
    command: serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8088}
      - NTFY_BEHIND_PROXY=${NTFY_BEHIND_PROXY:-false}
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    ports:
      - "${NTFY_PORT:-8088}:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy

  web:
    image: nginx:alpine
    container_name: osint_web
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/thehaohcm/scripts:/app/charts:ro
      - /home/thehaohcm/www:/app/charts_www:ro
    # Hostname "api" is provided by the separate `trading_api` container (network alias on osint_ai_worker_default),
    # see trading_api/docker-compose.yaml. It is no longer a service of this compose file.

volumes:
  postgres_data:
  ntfy_cache:
  ntfy_etc:
