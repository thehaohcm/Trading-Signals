# --- Giới hạn tần suất (rate limit) theo IP: chống dò mật khẩu/spam lệnh/cào API ---
# (file này được include trong khối http{} của nginx nên khai báo zone ở đây là hợp lệ)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_sensitive:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # --- Header bảo mật cơ bản (CSP chưa bật vì Clerk/TradingView/biểu đồ cần nguồn ngoài; bật sau khi liệt kê đủ nguồn) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP chế độ Report-Only: chỉ BÁO vi phạm trong DevTools (Console), KHÔNG chặn gì → không làm hỏng Clerk/TradingView.
    # Sau 1–2 tuần không còn cảnh báo thì đổi tên header thành Content-Security-Policy để bắt đầu chặn thật.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://s3.tradingview.com https://*.tradingview.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://*.tradingview.com https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chart images generated by python scripts (served from /app/charts_www)
    location = /cryto_rrgchart {
        default_type image/png;
        alias /app/charts_www/crypto_rrgchart.png;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /crypto_rrgchart {
        default_type image/png;
        alias /app/charts_www/crypto_rrgchart.png;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~ ^/([a-zA-Z0-9_]+)_rrgchart(\.png)?$ {
        default_type image/png;
        alias /app/charts_www/$1_rrgchart.png;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Endpoint nhạy cảm (đặt lệnh, đóng vị thế, cấu hình, chạy script): giới hạn chặt hơn + body nhỏ.
    # Go API vẫn bắt buộc JWT Clerk hợp lệ; đây là lớp chặn spam/dò ở rìa.
    location ~ ^/(breakout/(order/|positions/close$|positions/history$|sync-spot-balance$)|runSSHScript$|restartScript$|api/settings/update$|api/trading-settings/update$|api/trading/test-connection$|api/push/test$|api/notify/test$|api/osint/[a-z/-]+/trigger$|inputOTP$) {
        limit_req zone=api_sensitive burst=10 nodelay;
        client_max_body_size 1m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Backend Go API endpoints (trading_api on port 8080)
    # Chỉ khớp đúng đường dẫn API (có ranh giới "/" hoặc kết thúc), tránh nuốt trang SPA
    # như /breakout-radar hay /community khi người dùng refresh trang.
    location ~ ^/(api/|breakout(/|$)|getPotential[A-Za-z]*$|triggeredAlerts(/|$)|priceAlerts(/|$)|journal(/|$)|community/|runSSHScript$|scriptStatus$|restartScript$|inputOTP$|health$|take-notes(/|$)|static/) {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Frontend gọi /world/<endpoint> (vd /world/getPotentialWorldSymbols) -> bỏ prefix /world
    # và chuyển tới Go API nội bộ (giống proxy '/world' trong vue.config.js khi chạy dev).
    location /world/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Tỷ giá live-rates.com (giống proxy '/api/rates' và '/api/currency-prices' trong vue.config.js).
    # Dùng '^~' để ưu tiên hơn regex '/api/' ở trên (nếu không sẽ bị chuyển vào Go API và trả 404).
    location ^~ /api/rates {
        proxy_pass https://live-rates.com/rates;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    location ^~ /api/currency-prices {
        proxy_pass https://live-rates.com/rates;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    # --- External market data proxies (mirroring vercel.json) ---
    location /tcanalysis/ {
        proxy_pass https://apipubaws.tcbs.com.vn/tcanalysis/;
        proxy_ssl_server_name on;
    }

    location /stock-insight/ {
        proxy_pass https://apipubaws.tcbs.com.vn/stock-insight/;
        proxy_ssl_server_name on;
    }

    location /dnse-auth-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-auth-service/;
        proxy_ssl_server_name on;
    }

    location /dnse-financial-product/ {
        proxy_pass https://services.entrade.com.vn/dnse-financial-product/;
        proxy_ssl_server_name on;
    }

    location /dnse-user-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-user-service/;
        proxy_ssl_server_name on;
    }

    location /dnse-order-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-order-service/;
        proxy_ssl_server_name on;
    }

    location /dnse-deal-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-deal-service/;
        proxy_ssl_server_name on;
    }

    location /v4/stocks {
        proxy_pass https://api-finfo.vndirect.com.vn/v4/stocks;
        proxy_ssl_server_name on;
    }

    location /ff_calendar_thisweek.json {
        proxy_pass https://nfs.faireconomy.media/ff_calendar_thisweek.json;
        proxy_ssl_server_name on;
    }

    location /goldprice/ {
        proxy_pass https://sjc.com.vn/GoldPrice/;
        proxy_ssl_server_name on;
    }

    location /silverprice/ {
        proxy_pass https://giabac.phuquygroup.vn/PhuQuyPrice/;
        proxy_ssl_server_name on;
    }

    location /petrolimex/ {
        proxy_pass https://portals.petrolimex.com.vn/;
        proxy_ssl_server_name on;
    }

    location /yahoo-finance/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_ssl_server_name on;
    }
}
