server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chart images generated by python scripts (served from /app/charts_www)
    location = /cryto_rrgchart {
        default_type image/png;
        alias /app/charts_www/crypto_rrgchart.png;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /crypto_rrgchart {
        default_type image/png;
        alias /app/charts_www/crypto_rrgchart.png;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~ ^/([a-zA-Z0-9_]+)_rrgchart(\.png)?$ {
        default_type image/png;
        alias /app/charts_www/$1_rrgchart.png;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Backend Go API endpoints (trading_api on port 8080)
    location ~ ^/(api|breakout|getPotential|triggeredAlerts|priceAlerts|journal|community|runSSHScript|scriptStatus|restartScript|inputOTP|health|take-notes|static) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # --- External market data proxies (mirroring vercel.json) ---
    location /tcanalysis/ {
        proxy_pass https://apipubaws.tcbs.com.vn/tcanalysis/;
        proxy_ssl_server_name on;
    }

    location /stock-insight/ {
        proxy_pass https://apipubaws.tcbs.com.vn/stock-insight/;
        proxy_ssl_server_name on;
    }

    location /dnse-auth-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-auth-service/;
        proxy_ssl_server_name on;
    }

    location /dnse-financial-product/ {
        proxy_pass https://services.entrade.com.vn/dnse-financial-product/;
        proxy_ssl_server_name on;
    }

    location /dnse-user-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-user-service/;
        proxy_ssl_server_name on;
    }

    location /dnse-order-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-order-service/;
        proxy_ssl_server_name on;
    }

    location /dnse-deal-service/ {
        proxy_pass https://services.entrade.com.vn/dnse-deal-service/;
        proxy_ssl_server_name on;
    }

    location /v4/stocks {
        proxy_pass https://api-finfo.vndirect.com.vn/v4/stocks;
        proxy_ssl_server_name on;
    }

    location /ff_calendar_thisweek.json {
        proxy_pass https://nfs.faireconomy.media/ff_calendar_thisweek.json;
        proxy_ssl_server_name on;
    }

    location /goldprice/ {
        proxy_pass https://sjc.com.vn/GoldPrice/;
        proxy_ssl_server_name on;
    }

    location /silverprice/ {
        proxy_pass https://giabac.phuquygroup.vn/PhuQuyPrice/;
        proxy_ssl_server_name on;
    }

    location /petrolimex/ {
        proxy_pass https://portals.petrolimex.com.vn/;
        proxy_ssl_server_name on;
    }

    location /yahoo-finance/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_ssl_server_name on;
    }
}
