; Trading Alert Speaker — ESP32-S3 N16R8 (16MB flash, 8MB PSRAM octal)
; Build:  pio run          Nạp:  pio run -t upload          Xem log:  pio device monitor
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@7.4.2
